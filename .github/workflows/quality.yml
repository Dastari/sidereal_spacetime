name: Source quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .runtime/ci-lfs
          key: ci-lfs-${{ hashFiles('assets/ci/lfs-objects-r001.json') }}
      - run: python scripts/prepare_ci_lfs_assets.py
      - run: python scripts/prepare_ci_assets.py
      - run: npm ci
      - run: python -m pip install -r scripts/art_library/requirements.txt
      - run: python -m venv .runtime/construction-enclosure-python
      - run: .runtime/construction-enclosure-python/bin/python -m pip install -r scripts/geometry_tests/requirements.txt
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/quality-rules.test.mjs scripts/canvas-ui-rules.test.mjs
      - run: node scripts/check_canvas_ui.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:python
      - run: npm run art:check
      - run: python scripts/check_docs.py
