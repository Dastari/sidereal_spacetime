name: Source quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r scripts/art_library/requirements.txt
      - run: python -m venv .runtime/construction-enclosure-python
      - run: .runtime/construction-enclosure-python/bin/python -m pip install -r scripts/geometry_tests/requirements.txt
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: node --test scripts/quality-rules.test.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:python
