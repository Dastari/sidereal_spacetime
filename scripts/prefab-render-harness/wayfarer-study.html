<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wayfarer hull bay comparison</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07101b;
        color: #eaf2fb;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      aside {
        position: absolute;
        top: 18px;
        left: 20px;
        padding: 12px 16px;
        background: #091421e8;
        border: 1px solid #33485f;
        border-radius: 8px;
      }
      strong {
        display: block;
        font-size: 18px;
      }
      nav {
        display: flex;
        gap: 18px;
        margin: 6px 0;
      }
      a {
        color: #81d9f5;
      }
      a[aria-current="page"] {
        color: #fff;
        text-decoration-thickness: 2px;
      }
      #status {
        color: #b4c7d9;
        max-width: 480px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <aside>
      <strong>Wayfarer · completed hull bay</strong>
      <nav aria-label="Comparison">
        <a href="?mode=authored">Authored source</a>
        <a href="?mode=voxel">1/16 m voxels</a>
        <a href="?mode=cut">Cell cut</a>
      </nav>
      <div id="status">Loading the private comparison…</div>
    </aside>
    <script type="module" src="./wayfarer-study.ts"></script>
  </body>
</html>
