<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayfarer authored kit trial</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080d20;
        color: #dce9ff;
        font:
          14px system-ui,
          sans-serif;
      }
      #view {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      aside {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        border: 1px solid #374962;
        border-radius: 8px;
        background: #0b1426de;
        max-width: 560px;
        pointer-events: none;
      }
      strong {
        display: block;
        margin-bottom: 6px;
      }
      nav {
        margin-top: 8px;
        pointer-events: auto;
        display: flex;
        gap: 16px;
      }
      a {
        color: #79d6e9;
      }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Authored modular Wayfarer trial"></canvas>
    <aside>
      <strong>Wayfarer · authored modular kit trial</strong>
      <div id="status">Loading the completed kit…</div>
      <nav>
        <a href="?cam=hero">Deck</a><a href="?cam=reverse">Reverse</a
        ><a href="?cam=bow">Bridge</a><a href="?cam=rooms">Rooms</a>
      </nav>
    </aside>
    <script type="module" src="./wayfarer-authored.ts"></script>
  </body>
</html>
